[package]
name = "tomat"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false
description = "Three focus/break slots and a glass timer that stays on screen"
readme = "README.md"
keywords = ["pomodoro", "timer", "focus", "wayland"]

[dependencies]
ab_glyph = { version = "0.2.32", default-features = false, features = ["std"] }
anyhow = "1.0.104"
dirs = "7.0.0"
rustix = { version = "1.1", features = ["event", "fs", "process"] }
signal-hook = "0.3"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[dev-dependencies]
lexopt = "0.3.2"

[lints]
workspace = true

# The app and the window are two programs: the app stays, so it carries no toolkit.
[workspace]
members = ["window"]
default-members = [".", "window"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"

# Small over fast: a timer has nothing to compute.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
