# tomat: tools and tasks. `mise tasks` lists the tasks; `mise run <task>` runs one.

[tools]
# Same toolchain as rust-toolchain.toml; mise installs it through rustup.
rust = { version = "1.99.1", profile = "minimal", components = "rustfmt,clippy", targets = "x86_64-unknown-linux-musl" }

[tasks.check]
description = "Everything a change must pass: formatting, lints, tests"
run = [
    "cargo fmt --all --check",
    "cargo clippy --workspace --all-targets --locked -- -D warnings",
    "cargo test --workspace --locked",
]

[tasks.build]
description = "Build both programs: the app static, the window dynamic"
run = [
    "cargo build --release --locked -p tomat --bin tomat --target x86_64-unknown-linux-musl",
    "cargo build --release --locked -p tomat-window",
]

[tasks.install]
description = "Build, then install for this user: menu entry, icon, ~/.local/bin/tomat"
depends = ["build"]
run = "scripts/install.sh"

[tasks.glass]
description = "Preview the glass: draggable for 30 seconds, then click-through, gone after 10 minutes (Ctrl-C stops it)"
run = "cargo run -p tomat --release --locked --target x86_64-unknown-linux-musl --example glass-preview"
